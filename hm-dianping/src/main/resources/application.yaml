server:
  port: 8081
spring:
  application:
    name: hmdp
  # 自动加载本地私有配置 application-local.yaml（该文件已被 .gitignore 忽略，可以不存在）
  profiles:
    include: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ikun}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:192.168.234.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

hmdp:
  # 图片上传目录：必须指向 Nginx 站点 html/hmdp 下面的 imgs 目录，否则上传的图片无法访问
  upload-dir: ${HMDP_UPLOAD_DIR:D:/mongdb/nginx/nginx-1.18.0/html/hmdp/imgs/}
